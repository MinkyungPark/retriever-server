[project]
name = "retriever-server"
version = "0.1.0"
description = "E5 + FAISS HNSW retrieval server"
requires-python = ">=3.12"
dependencies = [
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "fastapi>=0.128.5",
  "uvicorn>=0.40.0",
  "sentence-transformers>=5.2.2",
  "faiss-cpu>=1.13.2",
  "requests>=2.32.5",
  "pyserini>=0.43.0",
  "huggingface-hub>=0.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"
